name: Backend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          CI: true
          # Stub required env vars for tests
          MONGODB_URI: mongodb://localhost:27017/swiftshare-test
          R2_ACCOUNT_ID: test-account
          R2_ACCESS_KEY_ID: test-key
          R2_SECRET_ACCESS_KEY: test-secret
          R2_BUCKET_NAME: test-bucket
          FRONTEND_URL: http://localhost:5173
          SHARE_BASE_URL: http://localhost:5173
          TOKEN_SECRET: test-token-secret-min-32-chars-long

      - name: Audit dependencies
        run: npm audit --audit-level=high || true
        # Warn on high, don't block CI for audit issues that aren't in our code
